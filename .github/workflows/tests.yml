name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  quant-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.2.0 pytest-asyncio==1.4.1
      - run: python -m pytest test_async_risk_guard.py test_quant_verifier_dse.py --asyncio-mode=strict -v
